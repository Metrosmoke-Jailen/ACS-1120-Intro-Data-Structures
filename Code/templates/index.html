<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markov Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>✨ Markov Text Generator</h1>

    <form method="get">
        <input type="number" name="num" min="1" max="10" placeholder="How many sentences?">
        <button type="submit">Generate</button>
    </form>

    <div class="output">
        {% for sentence in sentences %}
            <p>{{ sentence }}</p>
        {% endfor %}
    </div>

    <a href="/" class="refresh">🔄 Refresh</a>
</div>

</body>
</html>
